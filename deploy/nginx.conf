# Example for the host nginx in front of the container. Certificate: certbot or your own.
server {
    listen 443 ssl http2;
    server_name konkurs.example.ru;

    ssl_certificate     /etc/letsencrypt/live/konkurs.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konkurs.example.ru/privkey.pem;

    # Must be >= VIDEO_MAX_MB
    client_max_body_size 210m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name konkurs.example.ru;
    return 301 https://$host$request_uri;
}
